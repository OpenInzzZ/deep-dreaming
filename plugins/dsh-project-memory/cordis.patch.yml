# dsh-project-memory bundle patch: project memory tools, guidance, and the
# session-end memory review. Applied as one profile layer after the base and
# web-app bundles (the profile's own cordis.patch.yml and any --patch
# overlays still come later).
#
# The row lives on the HOST plane: the tools register into the host `tools`
# registry (visible to every session), the prompt section lands in the global
# systemPrompt layer (per-agent presets can still shadow it), and the
# agent/status + session/event listeners are process-global by nature.
- insert:
    - id: project-memory
      name: 'dsh-project-memory'
      config:
        # After every completed user turn, send the agent a short memory-review
        # followup: the agent decides whether durable project knowledge was
        # produced and saves it via project_memory_save when it was.
        autoReview: true
        # Directory name of the memory store under each project root.
        memoryDirName: '.dsh-memory'
        # Memory hygiene: after every save, scan for duplicate/similar notes
        # (same title, highly similar content, or one body contained in
        # another) and merge them, keeping the most used / original note.
        autoDedupe: true
        # Content-similarity threshold (0.1..0.95) for the auto-merge scan.
        mergeContentThreshold: 0.55
        # Maturity tracking: every search hit (and every save/update)
        # increments the note's usage_count, which drives its maturity level
        # (new -> developing -> mature -> authoritative).
        trackUsage: true
