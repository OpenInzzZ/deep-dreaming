# dsh-project-memory: lightweight auto-recall / auto-review bridge to Memorix.
#
# This plugin NO LONGER provides its own memory tools. The actual storage,
# search, deduplication, and maturity tracking are handled by Memorix
# (installed via `memorix setup --agent dsh --global`). This plugin only
# injects the system-prompt guidance and the session-start recall /
# session-end review followups that tell the agent when to use the
# mcp__memorix__* tools.
#
# The row lives on the HOST plane: the prompt section lands in the global
# systemPrompt layer (per-agent presets can still shadow it), and the
# agent/status + session/event listeners are process-global by nature.
- insert:
    - id: project-memory
      name: 'dsh-project-memory'
      config:
        # Session-start memory recall: before the first real user turn, queue
        # one recall followup so the agent loads relevant memories through
        # mcp__memorix__memorix_search first (renders as the 记忆 · 检索 card).
        autoRecall: true
        # After every completed user turn, send the agent a short memory-review
        # followup: the agent judges whether durable project knowledge was
        # produced and saves it via mcp__memorix__memorix_store when it was.
        autoReview: true