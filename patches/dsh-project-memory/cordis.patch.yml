# dsh-project-memory: lightweight auto-recall bridge to MCP Reference Memory.
#
# This plugin owns no storage and registers no tools. The actual graph storage,
# search, relations, and deletion are provided by the MCP reference server
# (@modelcontextprotocol/server-memory), mounted through
# @deepseek-ai/dsh-mcp-client in the HOME patch layer (~/.dsh/cordis.patch.yml,
# row id memory-mcp-reference, serverName reference_memory). This plugin only
# injects the system-prompt guidance and the session-start recall message that
# tell the agent when — and under which project prefix — to use the
# mcp__reference_memory__* tools.
#
# There is no auto-review row: the retired autoReview phase queued an
# agent.followup() after every completed turn, and a followup always becomes
# a turn of its own (documented in @deepseek-ai/dsh-agent), so it added a
# visible administrative turn per user turn. Saving is covered by the
# guidance section below.
#
# The row lives on the HOST plane: the prompt section lands in the global
# systemPrompt layer (per-agent presets can still shadow it), and the
# agent/pre-step + agent/disposed listeners are process-global by nature.
- insert:
    - id: project-memory
      name: 'dsh-project-memory'
      config:
        # Session-start memory recall: on the first admitted step of a session
        # with a workspace, inject one context message carrying that
        # workspace's project identifier, so the agent searches the reference
        # graph before starting substantial work (rides inside the turn:
        # renders as a folded context row, never as a turn of its own).
        autoRecall: true
